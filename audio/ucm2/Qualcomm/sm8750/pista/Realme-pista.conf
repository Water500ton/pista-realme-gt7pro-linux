Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8750/pista/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='Left Amp Switch' 1"
	cset "name='Right Amp Switch' 1"
	cset "name='Left Amp Gain' 6"
	cset "name='Right Amp Gain' 6"
	cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
