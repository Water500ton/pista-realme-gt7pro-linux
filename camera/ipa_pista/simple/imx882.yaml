# Calibrated libcamera Simple SoftISP tuning for Realme GT7 Pro (pista)
# Rear 50MP 3x Periscope Telephoto — Sony IMX882 / LYT-600
# Auto BlackLevel (avoids IMX355 12/255 AWB underflow) + damped stock CCM (alpha=0.30)
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  - Ccm:
      ccms:
        - ct: 2900
          ccm: [  1.2124, -0.2559,  0.0435,
                 -0.0474,  1.0546, -0.0072,
                  0.0192, -0.3348,  1.3156 ]
        - ct: 4500
          ccm: [  1.2254, -0.2243, -0.0011,
                 -0.0667,  1.1395, -0.0728,
                 -0.0044, -0.2427,  1.2471 ]
        - ct: 6500
          ccm: [  1.2424, -0.2412, -0.0012,
                 -0.0717,  1.1500, -0.0783,
                 -0.0015, -0.2610,  1.2625 ]
  - Adjust:
...
