# SPDX-License-Identifier: CC0-1.0
# Calibrated libcamera Simple SoftISP tuning for Realme GT7 Pro (pista)
# Rear 8MP 0.6x Ultrawide — Sony IMX355
# Calibrated blackLevel=3840 (15/255: eliminates purple-red shadow pedestal fog without AWB underflow)
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 3840
  - Awb:
  - Ccm:
      ccms:
        - ct: 2800
          ccm: [  1.0000,  0.0000,  0.0000,
                  0.0000,  1.0000,  0.0000,
                  0.0000, -0.0400,  1.0400 ]
        - ct: 4000
          ccm: [  1.0000,  0.0000,  0.0000,
                  0.0000,  1.0000,  0.0000,
                  0.0000, -0.0400,  1.0400 ]
        - ct: 6000
          ccm: [  1.0100, -0.0100,  0.0000,
                 -0.0100,  1.0200, -0.0100,
                  0.0000, -0.0350,  1.0350 ]
  - Adjust:
  - Agc:
...
