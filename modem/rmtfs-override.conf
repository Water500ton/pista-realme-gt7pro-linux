# EFS-safe sandboxed rmtfs configuration for Realme GT7 Pro:
# Serves read-only copies of modemst1/modemst2/fsg/fsc from /var/lib/pista-rmtfs
# (modem_fs1/modem_fs2/modem_fsg/modem_fsc) in RAM-only (-r) mode; NEVER opens
# raw Android UFS EFS partitions (-P omitted).
[Unit]
After=tqftpserv.service
Wants=tqftpserv.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -o /var/lib/pista-rmtfs -r -v
