# EFS-safe sandboxed rmtfs configuration for Realme GT7 Pro:
# Serves read-only copies of modemst1/modemst2/fsg/fsc plus Oplus RF NV
# backups (oplusstanvbk_a -> oem_stanvbk, oplusdycnvbk -> oem_dycnvbk) from
# /var/lib/pista-rmtfs in RAM-only (-r) mode; NEVER opens raw Android UFS
# EFS/NV partitions (-P omitted).
[Unit]
After=tqftpserv.service
Wants=tqftpserv.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -o /var/lib/pista-rmtfs -r -v
